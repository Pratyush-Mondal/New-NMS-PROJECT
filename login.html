<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Metaliks | NMS Control Center Login</title>
    <link rel="icon" type="image/png" href="assets/images/neo-metaliks-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="config.js"></script>
    <style>
        :root {
            --bg-base: #060e17;
            --card-bg: #0d1926;
            --card-border: #1c3043;
            --input-bg: #07121e;
            --input-border: #263e52;
            --input-focus: #27a7f4;
            --accent-blue: #168fd5;
            --accent-hover: #27a7f4;
            --text-primary: #edf4fb;
            --text-secondary: #8aa0b4;
            --text-muted: #526a7e;
            --danger: #ff6472;
            --danger-bg: rgba(255, 100, 114, 0.1);
            --danger-border: rgba(255, 100, 114, 0.3);
            --success: #2bd49b;
            --success-bg: rgba(43, 212, 155, 0.1);
            --success-border: rgba(43, 212, 155, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(circle at 80% 20%, rgba(39, 167, 244, 0.15), transparent 45%),
                radial-gradient(circle at 20% 80%, rgba(18, 107, 192, 0.12), transparent 45%),
                var(--bg-base);
            color: var(--text-primary);
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            width: 100%;
            padding: 40px 36px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-box {
            width: 76px;
            height: 76px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.15);
            padding: 8px;
            overflow: hidden;
        }

        .logo-box img,
        .brand-logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        /* Alert Box */
        .alert-box {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            margin-bottom: 20px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.4;
            animation: fadeIn 0.25s ease-out;
        }

        .alert-box.show {
            display: flex;
        }

        .alert-box.error {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: #ff8590;
        }

        .alert-box.success {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: #4ce3b2;
        }

        .alert-icon {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
        }

        .alert-text {
            flex-grow: 1;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #c5d4e2;
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            pointer-events: none;
            width: 18px;
            height: 18px;
            transition: color 0.2s ease;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            height: 48px;
            padding: 0 42px 0 44px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 9px;
            color: #ffffff;
            outline: none;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(39, 167, 244, 0.15);
            background: #091624;
        }

        input::placeholder {
            color: #496378;
        }

        .input-wrapper:focus-within .field-icon {
            color: var(--input-focus);
        }

        /* Password Toggle */
        .pwd-toggle-btn {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, background 0.2s;
        }

        .pwd-toggle-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        .pwd-toggle-btn:focus {
            outline: 2px solid var(--input-focus);
            outline-offset: 1px;
        }

        .pwd-toggle-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Form Controls Row (Remember Me) */
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: -6px;
            margin-bottom: 22px;
            font-size: 13px;
        }

        .remember-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            font-weight: 500;
        }

        .remember-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-hover);
            cursor: pointer;
            border-radius: 4px;
        }

        .remember-label:hover {
            color: #ffffff;
        }

        .support-hint {
            color: var(--text-muted);
            font-size: 12px;
        }

        /* Submit Button */
        .login-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #168fd5 0%, #1178b5 100%);
            color: #ffffff;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 14px rgba(22, 143, 213, 0.35);
            transition: all 0.2s ease;
        }

        .login-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #27a7f4 0%, #168fd5 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(39, 167, 244, 0.45);
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-arrow {
            transition: transform 0.2s ease;
        }

        .login-btn:hover:not(:disabled) .login-arrow {
            transform: translateX(3px);
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.7s linear infinite;
        }

        .login-btn.loading .spinner {
            display: inline-block;
        }

        .login-btn.loading .btn-text,
        .login-btn.loading .login-arrow {
            display: none;
        }

        /* Footer */
        .footer {
            margin-top: 26px;
            text-align: center;
            color: var(--text-muted);
            font-size: 11.5px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .footer span {
            color: var(--text-secondary);
            font-weight: 500;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 22px;
                border-radius: 14px;
            }
            .logo-box {
                width: 58px;
                height: 58px;
                border-radius: 14px;
                padding: 6px;
            }
            h1 {
                font-size: 21px;
            }
            .form-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }
    </style>
    <script src="config.js"></script>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">

            <!-- Brand Header -->
            <div class="brand-header">
                <div class="logo-box">
                    <img src="assets/images/neo-metaliks-logo.png" alt="Neo Metaliks Logo" class="brand-logo-img">
                </div>
                <h1>Neo Metaliks NMS</h1>
                <p class="subtitle">Network Monitoring & Control Center</p>
            </div>

            <!-- In-page Alert Container -->
            <div id="alertBox" class="alert-box" role="alert">
                <svg id="alertIconError" class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <svg id="alertIconSuccess" class="alert-icon" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <div id="alertText" class="alert-text"></div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleAdminLogin(event)" autocomplete="on" novalidate>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Admin Email Address</label>
                    <div class="input-wrapper">
                        <!-- Email SVG Icon -->
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                        </svg>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="e.g. admin@neometaliks.com"
                            autocomplete="username"
                            spellcheck="false"
                            required
                        >
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <!-- Lock SVG Icon -->
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your administrator password"
                            autocomplete="current-password"
                            required
                        >
                        <!-- Show / Hide Password Toggle -->
                        <button
                            type="button"
                            id="togglePasswordBtn"
                            class="pwd-toggle-btn"
                            onclick="togglePasswordVisibility()"
                            aria-label="Toggle password visibility"
                            title="Show/Hide password"
                        >
                            <!-- Eye Open SVG (Visible when password is hidden) -->
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <!-- Eye Off SVG (Visible when password is shown) -->
                            <svg id="eyeOffIcon" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                                <line x1="2" y1="2" x2="22" y2="22"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Form Options: Remember Me -->
                <div class="form-options">
                    <label class="remember-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember Email</span>
                    </label>
                    <span class="support-hint">Restricted Access</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="loginBtn" class="login-btn">
                    <span class="spinner"></span>
                    <span class="btn-text">Authenticate & Sign In</span>
                    <span class="login-arrow">→</span>
                </button>

            </form>

            <!-- Footer -->
            <div class="footer">
                <div><span>Neo Metaliks Ltd.</span> • NMS Infrastructure</div>
                <small>Authorized personnel only. All access monitored.</small>
            </div>

        </div>
    </div>

    <script>
        // DOM Elements
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const rememberMeInput = document.getElementById("rememberMe");
        const loginBtn = document.getElementById("loginBtn");
        const alertBox = document.getElementById("alertBox");
        const alertText = document.getElementById("alertText");
        const alertIconError = document.getElementById("alertIconError");
        const alertIconSuccess = document.getElementById("alertIconSuccess");
        const eyeIcon = document.getElementById("eyeIcon");
        const eyeOffIcon = document.getElementById("eyeOffIcon");

        // Restore remembered email on page load
        document.addEventListener("DOMContentLoaded", () => {
            try {
                const savedEmail = localStorage.getItem("nms_remembered_email");
                if (savedEmail) {
                    emailInput.value = savedEmail;
                    rememberMeInput.checked = true;
                    passwordInput.focus();
                } else {
                    emailInput.focus();
                }
            } catch (e) {
                console.warn("Storage access warning:", e);
            }
        });

        // Show/Hide Password Toggle
        function togglePasswordVisibility() {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.style.display = "none";
                eyeOffIcon.style.display = "block";
                passwordInput.setAttribute("aria-label", "Password shown");
            } else {
                passwordInput.type = "password";
                eyeIcon.style.display = "block";
                eyeOffIcon.style.display = "none";
                passwordInput.setAttribute("aria-label", "Password hidden");
            }
        }

        // Display in-card alert
        function showAlert(message, type = "error") {
            alertText.textContent = message;
            alertBox.classList.remove("error", "success");
            alertBox.classList.add(type);

            if (type === "success") {
                alertIconError.style.display = "none";
                alertIconSuccess.style.display = "block";
            } else {
                alertIconError.style.display = "block";
                alertIconSuccess.style.display = "none";
            }

            alertBox.classList.add("show");
        }

        function hideAlert() {
            alertBox.classList.remove("show");
        }

        // Email format validation (standard RFC email check)
        function isValidEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        // Handle Login Submission
        async function handleAdminLogin(event) {
            event.preventDefault();
            hideAlert();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            // 1. Validation checks
            if (!email) {
                showAlert("Please enter your administrator email address.", "error");
                emailInput.focus();
                return;
            }

            if (!isValidEmail(email)) {
                showAlert("Please enter a valid email format (e.g., admin@neometaliks.com).", "error");
                emailInput.focus();
                return;
            }

            if (!password) {
                showAlert("Please enter your password.", "error");
                passwordInput.focus();
                return;
            }

            // 2. Set loading state
            loginBtn.disabled = true;
            loginBtn.classList.add("loading");

            // 3. Resolve API URL
            function getNmsApiBase() {
                if (window.APP_CONFIG && window.APP_CONFIG.API_BASE_URL !== undefined && window.APP_CONFIG.API_BASE_URL !== null) {
                    return window.APP_CONFIG.API_BASE_URL;
                }
                if (window.location.protocol === "file:") {
                    return "http://127.0.0.1:8000";
                }
                if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
                    return window.location.port === "8081" ? "" : "http://" + window.location.hostname + ":8000";
                }
                if (window.location.hostname.includes("onrender.com")) {
                    return "";
                }
                if (window.location.hostname.includes("vercel.app") || window.location.protocol === "https:") {
                    return "https://neo-metaliks-nms.onrender.com";
                }
                return "";
            }

            const apiBase = getNmsApiBase();
            const apiUrl = apiBase + "/api/auth/login";

            try {
                // Timeout controller
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);

                const response = await fetch(apiUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                // Handle HTTP response
                if (!response.ok) {
                    if (response.status === 401 || response.status === 400) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.detail || errData.message || "Invalid administrator email or password.");
                    } else if (response.status >= 500) {
                        throw new Error("Internal server error. Please verify backend database status.");
                    } else {
                        throw new Error(`Authentication request failed with status HTTP ${response.status}.`);
                    }
                }

                const data = await response.json();

                if (!data.success || !data.access_token || !data.admin) {
                    throw new Error(data.message || "Invalid administrator credentials. Access denied.");
                }

                // 4. Handle Remember Me
                try {
                    if (rememberMeInput.checked) {
                        localStorage.setItem("nms_remembered_email", email);
                    } else {
                        localStorage.removeItem("nms_remembered_email");
                    }
                } catch (e) {}

                // 5. Store session and token safely
                localStorage.setItem("access_token", data.access_token);
                localStorage.setItem("admin_id", data.admin.id);
                localStorage.setItem("admin_name", data.admin.name || "Administrator");
                localStorage.setItem("admin_email", data.admin.email || email);
                localStorage.setItem("admin_phone", data.admin.phone || "");
                localStorage.setItem("admin_department", data.admin.department || "");
                localStorage.setItem("admin_location", data.admin.location || "");
                localStorage.setItem("loggedIn", "true");
                localStorage.setItem("adminLoggedIn", "true");

                showAlert("Authentication successful! Redirecting to Control Center...", "success");

                // Smooth redirect
                setTimeout(() => {
                    window.location.href = "index.html#dashboard";
                }, 300);

            } catch (err) {
                // Differentiate Network Error from Authentication Error
                if (err.name === "AbortError") {
                    showAlert("Connection timed out. The backend server took too long to respond.", "error");
                } else if (err.message && (err.message.includes("Failed to fetch") || err.message.includes("NetworkError") || err.message.includes("Load failed"))) {
                    showAlert("Unable to connect to NMS Backend API at " + apiBase + ". Please check if backend service is running.", "error");
                } else {
                    showAlert(err.message || "Authentication failed. Please verify your credentials.", "error");
                }

                loginBtn.disabled = false;
                loginBtn.classList.remove("loading");
            }
        }
    </script>
</body>
</html>
