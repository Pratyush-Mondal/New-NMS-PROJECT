<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Neo Metaliks | Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(39, 167, 244, 0.12),
                    transparent 35%
                ),
                #07111c;

            font-family:
                Arial,
                sans-serif;

            color: #edf4fb;
        }


        .login-card {

            width: 420px;

            max-width: 100%;

            padding: 35px;

            background: #0d1926;

            border: 1px solid #1c3043;

            border-radius: 16px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.55);
        }


        .logo {

            width: 60px;

            height: 60px;

            margin: 0 auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #27a7f4,
                    #126bc0
                );

            font-size: 25px;

            font-weight: bold;
        }


        h1 {

            text-align: center;

            font-size: 23px;

            margin-bottom: 7px;
        }


        .subtitle {

            text-align: center;

            color: #71859a;

            font-size: 12px;

            margin-bottom: 28px;
        }


        .form-group {

            margin-bottom: 17px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #b9c8d5;

            font-size: 12px;

            font-weight: 600;
        }


        input {

            width: 100%;

            height: 46px;

            padding: 0 13px;

            background: #07121e;

            border: 1px solid #263e52;

            border-radius: 8px;

            color: white;

            outline: none;

            font-size: 13px;
        }


        input:focus {

            border-color: #27a7f4;

            box-shadow:
                0 0 0 3px
                rgba(39,167,244,0.08);
        }


        .login-btn {

            width: 100%;

            height: 46px;

            margin-top: 8px;

            border: none;

            border-radius: 8px;

            background: #168fd5;

            color: white;

            font-weight: 600;

            cursor: pointer;

            transition: .2s;
        }


        .login-btn:hover {

            background: #27a7f4;
        }


        .login-btn:disabled {

            opacity: 0.7;

            cursor: not-allowed;
        }


        .error {

            display: none;

            margin-top: 13px;

            padding: 10px;

            border-radius: 7px;

            background:
                rgba(255,100,114,0.08);

            border: 1px solid
                rgba(255,100,114,0.25);

            color: #ff6472;

            font-size: 12px;

            text-align: center;
        }


        .footer {

            margin-top: 22px;

            text-align: center;

            color: #526a7e;

            font-size: 10px;
        }

    </style>

</head>


<body>


    <div class="login-card">

        <div class="logo">
            NM
        </div>


        <h1>
            Neo Metaliks NMS
        </h1>


        <p class="subtitle">
            Network Monitoring System
        </p>


        <form
            onsubmit="adminLogin(event)"
            class="login-form"
        >

            <div class="input-group">

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="input-group">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >

                <span>Login</span>
                <span class="login-arrow">→</span>

            </button>

        </form>


        <div class="footer">

            Neo Metaliks • NMS Control Center

        </div>

    </div>



<script>

async function adminLogin(event) {

    event.preventDefault();


    const emailElement =
        document.getElementById("email");

    const passwordElement =
        document.getElementById("password");

    const loginButton =
        document.querySelector(".login-btn");


    const email =
        emailElement
            ? emailElement.value.trim()
            : "";


    const password =
        passwordElement
            ? passwordElement.value
            : "";


    // ==========================================
    // BASIC VALIDATION
    // ==========================================

    if (!email || !password) {

        alert(
            "Please enter email and password."
        );

        return;
    }


    const originalButtonHTML =
        loginButton
            ? loginButton.innerHTML
            : "Login";


    try {

        // ======================================
        // BUTTON LOADING STATE
        // ======================================

        if (loginButton) {

            loginButton.disabled = true;

            loginButton.innerHTML =
                "Logging in...";
        }


        // ======================================
        // BACKEND LOGIN API
        // ======================================

        const response =
            await fetch(
                "http://127.0.0.1:8000/api/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );


        const data =
            await response.json();


        console.log(
            "✅ LOGIN API RESPONSE:",
            data
        );


        // ======================================
        // CHECK HTTP RESPONSE
        // ======================================

        if (!response.ok) {

            throw new Error(
                data.message ||
                data.detail ||
                "Login request failed."
            );
        }


        // ======================================
        // CHECK BACKEND SUCCESS
        // ======================================

        if (
            !data.success ||
            !data.access_token ||
            !data.admin
        ) {

            throw new Error(
                data.message ||
                "Invalid email or password."
            );
        }


        // ======================================
        // SAVE JWT ACCESS TOKEN
        // ======================================

        localStorage.setItem(
            "access_token",
            data.access_token
        );


        // ======================================
        // SAVE ADMIN INFORMATION
        // ======================================

        localStorage.setItem(
            "admin_id",
            data.admin.id
        );

        localStorage.setItem(
            "admin_name",
            data.admin.name || ""
        );

        localStorage.setItem(
            "admin_email",
            data.admin.email || ""
        );

        localStorage.setItem(
            "admin_phone",
            data.admin.phone || ""
        );

        localStorage.setItem(
            "admin_department",
            data.admin.department || ""
        );

        localStorage.setItem(
            "admin_location",
            data.admin.location || ""
        );


        // Existing frontend login flags
        localStorage.setItem(
            "loggedIn",
            "true"
        );

        localStorage.setItem(
            "adminLoggedIn",
            "true"
        );


        // ======================================
        // SUCCESS
        // ======================================

        console.log(
            "✅ JWT token saved successfully."
        );


        alert(
            "Login successful!"
        );


        // ======================================
        // GO TO INDEX / DASHBOARD
        // ======================================

        window.location.replace(
            "index.html"
        );


    } catch (error) {

        console.error(
            "❌ LOGIN ERROR:",
            error
        );


        alert(
            error.message ||
            "Unable to login. Please try again."
        );


    } finally {

        if (loginButton) {

            loginButton.disabled = false;

            loginButton.innerHTML =
                originalButtonHTML;
        }

    }

}

</script>


</body>

</html>
